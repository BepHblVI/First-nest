version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: practicesurvey_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  db_test:
    image: mysql:8.0
    container_name: practicesurvey_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-test}
      MYSQL_DATABASE: ${DB_DATABASE:-practicesurvey_test}
    ports:
      - '${DB_PORT_TEST:-3307}:3306'
    tmpfs:
      - /var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  mysql_data:
